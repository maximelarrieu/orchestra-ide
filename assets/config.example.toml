# Orchestra IDE — configuration
#
# Copie ce fichier vers ~/.config/orchestra/config.toml et adapte-le.
# Toutes les valeurs ci-dessous sont les valeurs par défaut : tu peux ne garder
# que les lignes que tu changes, le reste reprend ces défauts.
#
# Les prix sont INDICATIFS. Sur un abonnement Claude, rien n'est facturé à la
# requête : Orchestra compte les tokens réels et applique cette grille pour
# donner un ordre de grandeur comparable entre features. Le calcul se fait à
# l'affichage, donc modifier la grille recalcule tout l'historique.
#
# `cache_write` est le tarif du cache d'UNE HEURE, soit deux fois le prix
# d'entrée. C'est ce que Claude Code utilise par défaut : mesuré sur un vrai
# appel, le tarif « cinq minutes » sous-estimait le coût d'un tiers.
# `orchestra usage` signale d'une étoile les modèles absents de cette grille.

[daemon]
max_concurrent_agents = 3
# Plafond indicatif en USD pour l'ensemble des agents d'un ticket. Le budget de
# chaque agent est ramené à ce qu'il reste, et aucun ne démarre une fois le
# plafond atteint. À retirer pour ne fixer aucune limite.
# max_ticket_usd = 15.0
max_attempts = 2
# Un ticket qui tournait quand le daemon s'est arrêté reprend là où il en était
# au démarrage suivant, au lieu d'attendre ta relance.
resume_on_boot = false
# Le même appel d'outil ce nombre de fois de suite est une boucle : l'agent en est
# averti une fois et le journal le dit. 0 désactive.
loop_repeats = 8
# Un agent arrêté par une fenêtre d'usage (limite des 5 heures, par exemple) attend
# sa réouverture, au plus ce nombre de secondes, puis reprend sa session au lieu
# de faire échouer le ticket. 0 : n'attend pas. Non éprouvé sur un vrai refus.
rate_limit_wait_secs = 0
# Les membres d'une même étape marqués « parallel_ok » par l'équipe tournent en
# même temps dans le worktree, au lieu de l'un après l'autre. Ils doivent
# toucher des fichiers distincts : c'est l'orchestrateur qui le promet.
parallel_stages = false
# Un agent muet depuis ce nombre de secondes est signalé (« ⚑ un agent est
# silencieux »), sans être arrêté : un long build se tait aussi. 0 désactive.
stall_secs = 600
# Un rôle relancé sur le même ticket (correction, seconde relecture) reprend
# une copie de sa session précédente au lieu de tout relire.
fork_on_rerun = true
claude_bin = "claude"
# Le compte Claude des agents d'un projet qui ne dit rien lui-même. Le compte
# suit le dossier du projet : d'abord <projet>/.orchestra/account.toml
# (claude_config_dir = "~/.claude-perso"), puis le CLAUDE_CONFIG_DIR exporté par
# le .envrc du dépôt principal, puis cette valeur. Absente, c'est ~/.claude :
# jamais le shell d'où l'on a lancé le daemon.
# claude_config_dir = "/home/moi/.claude-pro"
branch_prefix = "orch/"

# Le modèle d'un agent vient d'abord de la proposition, puis de l'entête de son
# rôle (`model:`), enfin d'ici. « default » ne passe pas `--model`.
[defaults]
model = "default"
effort = "medium"
max_budget_usd = 5.0
# Un agent qui tourne en rond s'arrête sur ce nombre de tours, pas seulement
# sur son budget. À retirer pour ne passer aucune limite.
max_turns = 200

[orchestrator]
model = "default"
effort = "medium"
max_budget_usd = 2.0
max_turns = 60

# Chaque ticket se termine par une relecture. Le rôle est ajouté d'office à la
# fin de chaque proposition d'équipe, où tu peux encore l'enlever avant
# d'accepter. Un verdict bloquant renvoie au travail les rôles qu'il nomme,
# `max_rounds` fois au plus ; passé ça, le ticket t'est rendu en « à relire ».
[review]
enabled = true
role = "reviewer"
max_rounds = 2

# Les vérifications du dépôt, lancées par le daemon lui-même dans le worktree
# du ticket — pas par un agent. Une relecture *rapporte* que les tests passent ;
# ceci le *mesure*, et un code de sortie ne peut pas être optimiste. C'est ce
# résultat qui ouvre l'intégration.
# « commands » vide : Orchestra devine la commande depuis le dépôt principal
# (justfile, Makefile, Cargo.toml, package.json, pytest). Un dépôt qu'il ne sait
# pas deviner n'a simplement pas de porte, plutôt qu'une porte inventée.
# Les commandes viennent d'ici ou du dépôt principal, jamais de la branche :
# une branche qui choisit son examinateur n'est pas examinée.
# Un échec renvoie au travail le dernier rôle qui a écrit du code, avec la
# sortie de la commande. Toujours rouge après « max_rounds », le ticket échoue :
# c'est ce qui s'est passé, et il se relance sans perdre ce qui est déjà fait.
[checks]
enabled = true
commands = []
# Commandes rapides après chaque étape d'implémentation, par exemple
# ["cargo check"] : un build cassé repart vers son auteur tout de suite.
after_stage = []
timeout_secs = 900
max_rounds = 2

# L'intégrateur est le seul agent autorisé à faire du git pour de vrai. Il se
# lance à la main depuis l'écran Ticket, et seulement si la relecture n'a rien
# bloqué. Il reste dans le worktree : la fusion dans la branche par défaut est
# faite par le daemon en « --ff-only », jamais par un agent.
# « push = true » veut dire les deux : l'intégrateur pousse sa branche, et le
# daemon pousse la branche par défaut une fois la fusion faite. Sinon tout reste
# sur cette machine, et c'est toi qui pousses quand tu veux.
[integration]
enabled = true
role = "integrator"
# « merge » : le daemon fusionne ici, en avance rapide.
# « pr »    : la branche est poussée et une pull request est ouverte avec `gh` ;
#             le ticket reste « à relire » jusqu'à ce que tu la fusionnes, et il
#             se ferme tout seul quand c'est fait. Sans remote, on retombe sur
#             « merge ».
mode = "merge"
pr_poll_secs = 60
push = false
# L'intégrateur démarre seul quand la relecture dit « prêt » et que les
# vérifications sont vertes, sans attendre ton « i ». Désactivé par défaut.
auto = false
remove_worktree = true

# Un pane zellij par agent, qui fait tourner « orchestra tail » : une vue, pas
# une session à piloter — le daemon garde la main. À la fin d'un agent, son pane
# est renommé avec un symbole. « T » depuis l'écran Agent rouvre sa session
# Claude à la main (« claude --resume ») et passe l'agent en « manuel ».
# Le daemon doit tourner depuis zellij pour pouvoir ouvrir des panes.
# « layout » nomme la disposition installée par « orchestra init --zellij », et
# donc ce que prend « zellij -l ».
[zellij]
auto_pane = true
layout = "orchestra"

# Les alertes : le daemon mesure toutes les 30 s et écrit un événement quand une
# mesure passe au-dessus de son seuil, un autre quand elle redescend. Aucune par
# défaut. `kind` : cost_per_hour ($ indicatifs sur l'heure), tokens_per_hour,
# stalled (agents silencieux en ce moment), failures (agents en échec sur l'heure).
# [[monitors]]
# name = "budget"
# kind = "cost_per_hour"
# threshold = 5.0
#
# [[monitors]]
# name = "silence"
# kind = "stalled"
# threshold = 0

# Une notification de bureau (notify-send) chaque fois qu'un ticket se met à
# t'attendre : équipe à relire, fusion bloquée, agent silencieux…
[notify]
attention = false

# Une épopée acceptée : dès qu'un de ses tickets est libre (sans dépendance, ou
# ses dépendances fusionnées), l'orchestrateur lui propose une équipe. Une
# proposition seulement : rien ne se lance sans toi.
[epic]
auto_plan = true

# Après un ticket qui a connu des frictions (relecture bloquante, vérification
# rouge, redirection, refus du garde-fou), un agent bon marché propose au plus
# trois conventions ou ADR. Elles attendent ton accord, comme toute proposition.
[retro]
enabled = true
model = "haiku"
max_budget_usd = 0.5


# Un rôle relancé sur le même ticket (tour de correction, seconde relecture)
# monte d'un cran sur cette échelle, de la moins chère à la plus capable. Vide :
# le modèle ne change jamais. Un modèle absent de l'échelle n'est pas touché.
# Exemple : escalate = ["haiku", "sonnet", "opus"]
[routing]
escalate = []

# Plafonds en USD indicatifs, au-dessus de celui de chaque agent et de celui d'un
# ticket (`daemon.max_ticket_usd`). Aucun agent ne démarre quand l'un est atteint,
# et chacun voit son budget ramené à la marge la plus étroite. Tous absents : pas
# de limite. `epic_usd` : les tickets d'une épopée ensemble ; `project_usd` : tout
# ce qu'un projet a dépensé ; `day_usd` : tout, sur les dernières 24 heures.
[budget]

# Chaque agent tourne dans `bwrap` (bubblewrap) : le disque entier est en lecture
# seule, seuls le worktree, le dossier du compte Claude et `writable` s'écrivent,
# et `hide` (identifiants) est masqué pour les rôles sans git complet. Le réseau
# reste ouvert. « off » : le garde-fou seul. Sans `bwrap` installé, on retombe
# sur « off » avec un avertissement.
[sandbox]
mode = "off"
hide = [
    "~/.ssh",
    "~/.aws",
    "~/.gnupg",
    "~/.config/gcloud",
    "~/.config/gh",
]
writable = []

# Serveurs MCP qu'un rôle peut demander dans son entête (`mcp: [nom, …]`). Les
# agents tournent isolés de ta configuration : ils n'ont que ceux-là. Même forme
# que les `mcpServers` de Claude Code.
#
# [mcp_servers.context7]
# command = "npx"
# args = ["-y", "@upstash/context7-mcp"]
#
# [mcp_servers.playwright]
# command = "npx"
# args = ["@playwright/mcp@latest"]

[models]
aliases = [
    "fable",
    "opus",
    "sonnet",
    "haiku",
]

[pricing.claude-fable-5]
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 20.0

[pricing.claude-haiku-4]
input = 1.0
output = 5.0
cache_read = 0.1
cache_write = 2.0

