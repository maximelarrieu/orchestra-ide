# Orchestra IDE — configuration
#
# Copie ce fichier vers ~/.config/orchestra/config.toml et adapte-le.
# Toutes les valeurs ci-dessous sont les valeurs par défaut : tu peux ne garder
# que les lignes que tu changes, le reste reprend ces défauts.
#
# Les prix sont INDICATIFS. Sur un abonnement Claude, rien n'est facturé à la
# requête : Orchestra compte les tokens réels et applique cette grille pour
# donner un ordre de grandeur comparable entre features. Le calcul se fait à
# l'affichage, donc modifier la grille recalcule tout l'historique.
#
# `cache_write` est le tarif du cache d'UNE HEURE, soit deux fois le prix
# d'entrée. C'est ce que Claude Code utilise par défaut : mesuré sur un vrai
# appel, le tarif « cinq minutes » sous-estimait le coût d'un tiers.
# `orchestra usage` signale d'une étoile les modèles absents de cette grille.

[daemon]
max_concurrent_agents = 3
max_attempts = 2
# Un agent muet depuis ce nombre de secondes est signalé (« ⚑ un agent est
# silencieux »), sans être arrêté : un long build se tait aussi. 0 désactive.
stall_secs = 600
# Un rôle relancé sur le même ticket (correction, seconde relecture) reprend
# une copie de sa session précédente au lieu de tout relire.
fork_on_rerun = true
claude_bin = "claude"
branch_prefix = "orch/"

# Le modèle d'un agent vient d'abord de la proposition, puis de l'entête de son
# rôle (`model:`), enfin d'ici. « default » ne passe pas `--model`.
[defaults]
model = "default"
effort = "medium"
max_budget_usd = 5.0
# Un agent qui tourne en rond s'arrête sur ce nombre de tours, pas seulement
# sur son budget. À retirer pour ne passer aucune limite.
max_turns = 200

[orchestrator]
model = "default"
effort = "medium"
max_budget_usd = 2.0
max_turns = 60

# Chaque ticket se termine par une relecture. Le rôle est ajouté d'office à la
# fin de chaque proposition d'équipe, où tu peux encore l'enlever avant
# d'accepter. Un verdict bloquant renvoie au travail les rôles qu'il nomme,
# `max_rounds` fois au plus ; passé ça, le ticket t'est rendu en « à relire ».
[review]
enabled = true
role = "reviewer"
max_rounds = 2

# Les vérifications du dépôt, lancées par le daemon lui-même dans le worktree
# du ticket — pas par un agent. Une relecture *rapporte* que les tests passent ;
# ceci le *mesure*, et un code de sortie ne peut pas être optimiste. C'est ce
# résultat qui ouvre l'intégration.
# « commands » vide : Orchestra devine la commande depuis le dépôt principal
# (justfile, Makefile, Cargo.toml, package.json, pytest). Un dépôt qu'il ne sait
# pas deviner n'a simplement pas de porte, plutôt qu'une porte inventée.
# Les commandes viennent d'ici ou du dépôt principal, jamais de la branche :
# une branche qui choisit son examinateur n'est pas examinée.
# Un échec renvoie au travail le dernier rôle qui a écrit du code, avec la
# sortie de la commande. Toujours rouge après « max_rounds », le ticket échoue :
# c'est ce qui s'est passé, et il se relance sans perdre ce qui est déjà fait.
[checks]
enabled = true
commands = []
# Commandes rapides après chaque étape d'implémentation, par exemple
# ["cargo check"] : un build cassé repart vers son auteur tout de suite.
after_stage = []
timeout_secs = 900
max_rounds = 2

# L'intégrateur est le seul agent autorisé à faire du git pour de vrai. Il se
# lance à la main depuis l'écran Ticket, et seulement si la relecture n'a rien
# bloqué. Il reste dans le worktree : la fusion dans la branche par défaut est
# faite par le daemon en « --ff-only », jamais par un agent.
# « push = true » veut dire les deux : l'intégrateur pousse sa branche, et le
# daemon pousse la branche par défaut une fois la fusion faite. Sinon tout reste
# sur cette machine, et c'est toi qui pousses quand tu veux.
[integration]
enabled = true
role = "integrator"
# « merge » : le daemon fusionne ici, en avance rapide.
# « pr »    : la branche est poussée et une pull request est ouverte avec `gh` ;
#             le ticket reste « à relire » jusqu'à ce que tu la fusionnes, et il
#             se ferme tout seul quand c'est fait. Sans remote, on retombe sur
#             « merge ».
mode = "merge"
pr_poll_secs = 60
push = false
remove_worktree = true

# Un pane zellij par agent, qui fait tourner « orchestra tail » : une vue, pas
# une session à piloter — le daemon garde la main. À la fin d'un agent, son pane
# est renommé avec un symbole. « T » depuis l'écran Agent rouvre sa session
# Claude à la main (« claude --resume ») et passe l'agent en « manuel ».
# Le daemon doit tourner depuis zellij pour pouvoir ouvrir des panes.
# « layout » nomme la disposition installée par « orchestra init --zellij », et
# donc ce que prend « zellij -l ».
[zellij]
auto_pane = true
layout = "orchestra"

# Une notification de bureau (notify-send) chaque fois qu'un ticket se met à
# t'attendre : équipe à relire, fusion bloquée, agent silencieux…
[notify]
attention = false

# Une épopée acceptée : dès qu'un de ses tickets est libre (sans dépendance, ou
# ses dépendances fusionnées), l'orchestrateur lui propose une équipe. Une
# proposition seulement : rien ne se lance sans toi.
[epic]
auto_plan = true

[models]
aliases = [
    "fable",
    "opus",
    "sonnet",
    "haiku",
]

[pricing.claude-fable-5]
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 20.0

[pricing.claude-haiku-4]
input = 1.0
output = 5.0
cache_read = 0.1
cache_write = 2.0

[pricing.claude-mythos-5]
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 20.0

[pricing.claude-opus-4]
input = 5.0
output = 25.0
cache_read = 0.5
cache_write = 10.0

[pricing.claude-opus-5]
input = 5.0
output = 25.0
cache_read = 0.5
cache_write = 10.0

[pricing.claude-sonnet-4]
