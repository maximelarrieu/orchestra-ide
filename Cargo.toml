[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/maximelarrieu/orchestra-ide"

[workspace.dependencies]
orchestra-core = { path = "crates/orchestra-core" }
orchestra-daemon = { path = "crates/orchestra-daemon" }
orchestra-tui = { path = "crates/orchestra-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset", "serde-well-known"] }
thiserror = "2"
anyhow = "1"
toml = "1"
serde_yaml_ng = "0.10"
directories = "6"
regex = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
nix = { version = "0.31", features = ["signal", "fs"] }
clap = { version = "4", features = ["derive"] }

ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
textwrap = "0.16"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
